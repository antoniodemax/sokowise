name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository; nothing here needs a writable token.
permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks, no tracked .env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: No environment file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.example$'; then
            echo "::error::an environment file is tracked; remove it and rotate its contents"
            exit 1
          fi
      - name: Scan history and tree for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  backend:
    name: Backend (ruff, mypy, pytest, alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sokowise
          POSTGRES_PASSWORD: sokowise
          POSTGRES_DB: sokowise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sokowise -d sokowise_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql+asyncpg://sokowise:sokowise@localhost:5432/sokowise_test
      TEST_DATABASE_URL: postgresql+asyncpg://sokowise:sokowise@localhost:5432/sokowise_test
      # Test-only signing key; not a secret.
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Migrate an empty database and check for model drift
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker (compose config, backend image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build ./backend
