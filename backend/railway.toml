# Railway service configuration for the backend (docs/ARCHITECTURE.md §13, docs/OPERATIONS.md).
# Config-as-code: Railway reads this file from the service's root directory (backend/).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Apply migrations before the new version receives traffic. The image ships alembic.ini
# and alembic/ for exactly this purpose.
preDeployCommand = "alembic upgrade head"
healthcheckPath = "/health/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
