# Secret scanning (gitleaks). Runs in CI over the full history and can be run locally:
#   docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact
# Only documented placeholders and test-only fixtures are allow-listed; never a real value.
title = "SokoWise"

[extend]
useDefault = true

[allowlist]
description = "Placeholders from .env.example and throwaway test/CI fixtures"
paths = ['''^\.env\.example$''']
regexes = [
  '''sk-ant-test-secret''',
  '''(ci|test)-only-jwt-secret-with-at-least-32-characters''',
  '''change-me-to-at-least-32-random''',
  '''postgresql(\+asyncpg)?://sokowise:sokowise@''',
  '''u:p@127\.0\.0\.1:1/nowhere''',
  # Fake Google signup token in the frontend test for the finish-up form.
  '''tok-0123456789abcdefghij''',
]
